name: Verify generated page

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  verify-page:
    name: Verify page matches analysis output
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install render dependencies
        run: |
          # render_page.py uses only Python standard library modules.
          # No package installation is required for this verification job.
          echo "No Python packages to install."

      - name: Regenerate index.html
        run: python render_page.py

      - name: Verify generated page matches committed artifact
        run: |
          if ! git diff --exit-code -- index.html; then
            echo "::error::index.html is generated by render_page.py from index.template.html and stats.json. Do not edit index.html by hand; run python render_page.py locally and commit the regenerated file."
            echo "Diff for index.html:"
            git --no-pager diff -- index.html
            exit 1
          fi

      - name: Verify no unsubstituted tokens remain
        run: |
          if grep -nF '{{stats:' index.html; then
            echo "::error::Found unsubstituted template token(s) in index.html. Regenerate with python render_page.py and commit the result."
            exit 1
          fi

      - name: Verify figure hash matches committed stats provenance
        run: |
          set -euo pipefail

          expected_hash=$(python -c "import json,sys; p=json.load(open('stats.json','r',encoding='utf-8')).get('provenance'); sys.exit('ERROR: stats.json provenance must include figure_sha256.') if (not isinstance(p, dict) or not p.get('figure_sha256')) else None; print(p['figure_sha256'])")
          figure_file=$(python -c "import json,sys; p=json.load(open('stats.json','r',encoding='utf-8')).get('provenance'); sys.exit('ERROR: stats.json provenance must include figure_filename.') if (not isinstance(p, dict) or not p.get('figure_filename')) else None; print(p['figure_filename'])")

          if [[ ! -f "$figure_file" ]]; then
            echo "::error::Figure file from stats.json provenance does not exist: $figure_file"
            exit 1
          fi

          actual_hash=$(sha256sum "$figure_file" | awk '{print $1}')
          if [[ "$actual_hash" != "$expected_hash" ]]; then
            echo "::error::Figure hash mismatch. stats.json and figure artifact come from different runs. Re-run colorado_snowpack_enso.py locally so stats.json, snowpack_enso_stats.txt, and the figure are regenerated together, then re-run render_page.py and commit all outputs."
            echo "figure file: $figure_file"
            echo "expected figure_sha256 from stats.json: $expected_hash"
            echo "actual figure_sha256 from committed file: $actual_hash"
            exit 1
          fi
